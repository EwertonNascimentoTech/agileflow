<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cronograma — AgileFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --blue:#014898; --blue-700:#013a78; --blue-50:#eaf1fa; --blue-100:#d6e3f4;
    --green:#6AB42F; --green-50:#eef7e6;
    --orange:#E84E0F; --orange-50:#fdece4;
    --card:#FFFFFF; --bg:#F8F8F8; --border:#E8E8E8; --border-strong:#dcdfe4;
    --ink:#1b2434; --muted:#5b6675; --faint:#8a93a1;
    --rail:#0c1b33; --rail-soft:#13294a;
    --radius:7px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
    --shadow-md:0 4px 12px rgba(16,24,40,.08), 0 2px 4px rgba(16,24,40,.05);
    --shadow-lg:0 12px 32px rgba(16,24,40,.14), 0 4px 8px rgba(16,24,40,.06);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    font-feature-settings:"cv11","ss01";
  }
  #root{min-height:100vh;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  ::-webkit-scrollbar{height:11px;width:11px;}
  ::-webkit-scrollbar-thumb{background:#cfd4db;border-radius:8px;border:3px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:#b9c0c9;}
  ::-webkit-scrollbar-track{background:transparent;}
  .tnum{font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="app.jsx" data-presets="react"></script>
<script type="text/babel" src="ui.jsx" data-presets="react"></script>
<script type="text/babel" src="gantt.jsx" data-presets="react"></script>
</body>
</html>
