<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>AgileFlow</title>
    <style>
      #rtd-boot {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        margin: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #fff;
        background: linear-gradient(135deg, #172554 0%, #1e3a8a 45%, #0369a1 100%);
        font-family: system-ui, -apple-system, sans-serif;
      }
      #rtd-boot.is-on { display: flex; }
      #rtd-boot .kicker { font-size: 14px; font-weight: 900; font-style: italic; margin: 0; }
      #rtd-boot .org { font-size: 10px; font-weight: 600; letter-spacing: 0.2em; color: #bae6fd; margin: 6px 0 0; }
      #rtd-boot h1 { margin: 32px 0 0; font-size: 28px; font-weight: 900; font-style: italic; line-height: 0.95; }
      #rtd-boot h1 span { display: block; color: #7dd3fc; }
      #rtd-boot .hint { margin: 12px 0 0; font-size: 14px; color: rgba(224, 242, 254, 0.85); }
      #rtd-boot .track { width: min(28rem, 100%); height: 10px; margin-top: 32px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,0.2); }
      #rtd-boot .fill { height: 100%; width: 35%; border-radius: 999px; background: linear-gradient(90deg, #7dd3fc, #fff); animation: rtd-boot-bar 1.8s ease-in-out infinite; }
      @keyframes rtd-boot-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(380%); }
      }
    </style>
  </head>
  <body class="notranslate">
    <div id="rtd-boot" aria-live="polite">
      <div style="width:min(28rem,100%)">
        <p class="kicker">Sistema FIEA</p>
        <p class="org">SESI · SENAI · IEL</p>
        <h1><span>REUNIÃO</span>TOMADA DE DECISÃO</h1>
        <p class="hint">Preparando a apresentação pública…</p>
        <div class="track"><div class="fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      if (/^\/p\/rtd\//.test(location.pathname)) {
        var el = document.getElementById("rtd-boot");
        if (el) el.className = "is-on";
        document.documentElement.style.background = "#172554";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
