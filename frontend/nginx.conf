server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads passam pelo proxy /api/ — alinhar ao limite do backend (20 MB).
    client_max_body_size 25m;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-XSS-Protection          "1; mode=block"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # SPA fallback — todas as rotas vão para o index.html.
    # index.html nunca é cacheado: os chunks têm hash no nome e são imutáveis, então um
    # index.html velho aponta para arquivos que já não existem depois de um deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Proxy para o backend FastAPI
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # MinIO path-style (URLs pré-assinadas: /{bucket}/{object}?X-Amz-...).
    # Host público assinado (ex. agileflow.tdsistemafiea.com.br) — repassar $host.
    location /saas-storage/ {
        proxy_pass         http://minio:9000/saas-storage/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        client_max_body_size 25m;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
