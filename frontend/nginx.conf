server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads passam pelo proxy /api/ — alinhar ao limite do backend (20 MB).
    client_max_body_size 25m;

    # DNS do Docker: com o host numa variável o nginx resolve `api`/`minio` a cada 10s, em vez de
    # só no boot. Sem isso, recriar o saas_api (IP novo) deixava o proxy no IP velho → 502 em /api.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream   api:8000;
    set $minio_upstream minio:9000;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-XSS-Protection          "1; mode=block"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://sso.idigital.sistemafiea.com.br; frame-ancestors 'none';" always;

    # SPA fallback — todas as rotas vão para o index.html.
    # index.html nunca é cacheado: os chunks têm hash no nome e são imutáveis, então um
    # index.html velho aponta para arquivos que já não existem depois de um deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Saúde da API (banco + Redis) também pelo domínio público — antes caía no fallback da
    # SPA e respondia 200 com o index.html mesmo com a API fora do ar.
    location = /health {
        proxy_pass         http://$api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header Cache-Control "no-store" always;
    }

    # Proxy para o backend FastAPI
    location /api/ {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # MinIO path-style (URLs pré-assinadas: /{bucket}/{object}?X-Amz-...).
    # Host público assinado (ex. agileflow.tdsistemafiea.com.br) — repassar $host.
    location /saas-storage/ {
        # Sem URI no proxy_pass (variável): repassa /saas-storage/... como veio.
        proxy_pass         http://$minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        client_max_body_size 25m;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
