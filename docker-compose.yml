# O arquivo .env na raiz é lido automaticamente pelo Docker Compose
# Copie: cp .env.example .env  e edite com seus valores

services:

  # ── FRONTEND (nginx + React build) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-18082}:80"
    depends_on:
      - api

  # ── API (FastAPI) ─────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_api
    restart: unless-stopped
    env_file: .env
    environment:
      DOCS_ROOT: /docs
    volumes:
      - ./docs:/docs:ro
    ports:
      - "${API_HOST_PORT:-18084}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-4}

  # ── CELERY WORKER ────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_celery
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  # ── CELERY BEAT (agendamentos) ───────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      - celery_worker
    command: celery -A app.core.celery_app beat --loglevel=info

  # ── POSTGRES ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tuning básico OLTP (valores conservadores, seguros p/ hosts pequenos):
    # - max_connections folgado p/ os 4 workers × pool + Celery
    # - jit=off ajuda cargas de muitas queries curtas
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - jit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── REDIS ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    # Limita memória e evita crescimento sem fim ao usar como cache (auth etc):
    # despeja as chaves menos usadas quando cheio. Mantém a persistência default
    # (RDB) — o Redis também é result-backend do Celery.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── RABBITMQ ─────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: saas_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"     # Management UI → http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MINIO ────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: saas_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_HOST_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ── BACKUP (Postgres + MinIO + .env) — 12h e 17h (America/Sao_Paulo) ──
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: saas_backup
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - minio_data:/minio-data:ro
      - ./.env:/source/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # ── FLOWER (monitor Celery) ──────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: saas_flower
    restart: unless-stopped
    env_file: .env
    ports:
      - "5555:5555"       # Dashboard → http://localhost:5555
    depends_on:
      - rabbitmq
      - redis
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
